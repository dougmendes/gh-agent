name: ci-pipeline

on:
  pull_request:
      branches:
        - main
 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Test Stage
        run: |
          echo "Running tests..."
          echo "All tests passed!"

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: test
    steps:
      - name: Show PR diff for lambdas
        run: |
          if gh pr diff ${{ github.event.pull_request.number }} --name-only | grep -q '^lambda/lambda.go$'; then
            echo "Changes in lambda/lambda.go:"
            gh pr diff ${{ github.event.pull_request.number }} -- lambda/lambda.go
          else
            echo "No changes in lambda/lambda.go"
          fi
      - name: Echo Build Stage
        run: |
          echo "Building project..."
          echo "Build successful."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Echo Deploy Stage
        run: |
          echo "Deploying project..."
          echo "Deployment complete."
  
  send-metadata:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read  
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: eu-north-1  # ou us-east-1, etc.
        
      - name: Send metadata to SQS
        env:
          QUEUE_URL: https://sqs.eu-north-1.amazonaws.com/239613528054/AnalyzeLogs
        run: |
          ORG_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          WORKFLOW_FILE="${{ github.workflow }}"
          BRANCH_NAME="${{ github.head_ref || github.ref_name  }}"
        
          JSON_PAYLOAD=$(jq -n \
            --arg org "$ORG_NAME" \
            --arg repo "$REPO_NAME" \
            --arg workflow "$WORKFLOW_FILE" \
            --arg branch "$BRANCH_NAME" \
            '{orgname: $org, reponame: $repo, workflowfilename: $workflow, branchname: $branch}')
        
          echo "Sending payload: $JSON_PAYLOAD"
        
          aws sqs send-message \
            --queue-url "$QUEUE_URL" \
            --message-body "$JSON_PAYLOAD"  
