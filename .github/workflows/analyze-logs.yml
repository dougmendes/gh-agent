name: Analyze Workflow Logs

on:
  workflow_dispatch: 
    inputs:
      triggered_by:
        description: "Trigger"
        required: false
        default: "automation"

jobs:
  log-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run log collector
        run: |
          go run agent/agent.go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
